<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Viewer - 3D Solar System</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: sans-serif;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <div id="info">🪐 Drag to rotate · Scroll to zoom · Realistic orbits</div>

  <!-- Three.js from CDN – no download needed -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Setup scene, camera, renderer ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 60);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 5;
    controls.maxDistance = 200;

    // --- Lighting ---
    const sunLight = new THREE.PointLight(0xffffff, 2, 0, 0);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x222244));

    // --- Starfield ---
    const starsGeometry = new THREE.BufferGeometry();
    const starCount = 2000;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 600;
      starPositions[i + 1] = (Math.random() - 0.5) * 400;
      starPositions[i + 2] = (Math.random() - 0.5) * 400;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);

    // --- Sun ---
    const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
    const sunMaterial = new THREE.MeshStandardMaterial({
      color: 0xffaa00,
      emissive: 0xff5500,
      roughness: 0.4
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // --- Planets data ---
    const planetsData = [
      { name: 'Mercury', distance: 6, size: 0.4, color: 0xaaaaaa, speed: 0.02 },
      { name: 'Venus', distance: 8, size: 0.8, color: 0xffcc88, speed: 0.015 },
      { name: 'Earth', distance: 10, size: 0.9, color: 0x2299ff, speed: 0.01 },
      { name: 'Mars', distance: 13, size: 0.5, color: 0xff6644, speed: 0.008 },
      { name: 'Jupiter', distance: 18, size: 2.2, color: 0xffcc99, speed: 0.005 },
      { name: 'Saturn', distance: 23, size: 1.8, color: 0xeeddbb, speed: 0.004, ring: true },
      { name: 'Uranus', distance: 28, size: 1.3, color: 0x99ddff, speed: 0.003 },
      { name: 'Neptune', distance: 33, size: 1.2, color: 0x4466ff, speed: 0.002 }
    ];

    const planets = [];
    planetsData.forEach((data) => {
      const geometry = new THREE.SphereGeometry(data.size, 32, 32);
      const material = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
      const planet = new THREE.Mesh(geometry, material);
      planet.userData = {
        distance: data.distance,
        speed: data.speed,
        angle: Math.random() * Math.PI * 2
      };
      scene.add(planet);

      if (data.ring) {
        const ringGeometry = new THREE.RingGeometry(data.size * 1.4, data.size * 2.2, 64);
        const ringMaterial = new THREE.MeshStandardMaterial({
          color: 0xc2b280,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.4,
          roughness: 0.5
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2 + 0.1;
        planet.add(ring);
      }

      const orbitPoints = [];
      const radius = data.distance;
      for (let i = 0; i <= 128; i++) {
        const angle = (i / 128) * Math.PI * 2;
        orbitPoints.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
      }
      const orbitGeometry = new THREE.BufferGeometry().setFromPoints(orbitPoints);
      const orbitLine = new THREE.Line(
        orbitGeometry,
        new THREE.LineBasicMaterial({ color: 0x334455 })
      );
      scene.add(orbitLine);

      planets.push(planet);
    });

    // --- Animation loop ---
    function animate() {
      requestAnimationFrame(animate);

      planets.forEach((planet) => {
        planet.userData.angle += planet.userData.speed;
        const dist = planet.userData.distance;
        planet.position.x = Math.cos(planet.userData.angle) * dist;
        planet.position.z = Math.sin(planet.userData.angle) * dist;
        planet.rotation.y += 0.01;
      });

      stars.rotation.y += 0.0001;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
